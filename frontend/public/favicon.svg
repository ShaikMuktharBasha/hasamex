<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Warm Terracotta Gradient Background -->
  <defs>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#da7a5b"/>
      <stop offset="100%" stop-color="#b85f44"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#terracottaGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Lens & Asterisk Editorial Emblem -->
  <!-- Outer Focus Ring -->
  <circle cx="32" cy="32" r="18" stroke="#faf9f5" stroke-width="2.5" stroke-opacity="0.9" fill="none"/>
  
  <!-- Optical Cross & Radial Intelligence Rays (Claude-inspired Asterisk) -->
  <path d="M32 18V46" stroke="#faf9f5" stroke-width="2.75" stroke-linecap="round"/>
  <path d="M18 32H46" stroke="#faf9f5" stroke-width="2.75" stroke-linecap="round"/>
  <path d="M22.1 22.1L41.9 41.9" stroke="#faf9f5" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75"/>
  <path d="M41.9 22.1L22.1 41.9" stroke="#faf9f5" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75"/>

  <!-- Center Core Lens Dot -->
  <circle cx="32" cy="32" r="4" fill="#faf9f5" filter="url(#softGlow)"/>
  <circle cx="32" cy="32" r="1.75" fill="#b85f44"/>
</svg>