services:
  # -------------------------------------------------------------
  # Backend: FastAPI Intelligence Engine
  # -------------------------------------------------------------
  - type: web
    name: expertlens-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small

  # -------------------------------------------------------------
  # Frontend: React + Vite + TypeScript Dashboard (Claude Theme)
  # -------------------------------------------------------------
  - type: web
    name: expertlens-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: expertlens-ai-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
